<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ポーズ写真ガイド（モック）｜NOAH newborn photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#6b5847;--ink-soft:#8a7663;--brand:#a5815f;--brand-deep:#7d5f43;--accent:#9a7bb5;--paper:#fffefa;--ivory:#fbf7ef;--lav:#f2eef8;--line:#eadfce;--shadow:0 18px 40px rgba(150,120,85,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:var(--paper);line-height:1.8;font-size:15px;-webkit-text-size-adjust:100%}
img{display:block;max-width:100%}
.serif{font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.hd{padding:16px 0 4px;display:flex;align-items:baseline;gap:12px}
.hd-name{font-family:"Shippori Mincho B1",serif;font-size:22px;font-weight:700;letter-spacing:.14em;color:#5d4a38}
.hd-tag{font-size:11px;letter-spacing:.3em;color:var(--brand);font-weight:700}
.preview-tag{display:inline-block;background:#c96f4a;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:3px 9px;letter-spacing:.08em}
.hero{padding:26px 0 8px;text-align:center}
.hero h1{font-family:"Shippori Mincho B1",serif;font-size:clamp(26px,6.4vw,38px);font-weight:600;color:#57452f;letter-spacing:.04em}
.hero p{margin:14px auto 0;color:var(--ink-soft);font-size:14.5px;max-width:620px}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:26px 0 6px}
.f-btn{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer;min-height:46px}
.f-btn.cur{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
.g-count{text-align:center;font-size:12.5px;color:#b39d83;letter-spacing:.12em;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:10px}
@media (min-width:820px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 10px 24px rgba(150,120,85,.08);cursor:pointer;text-align:left;padding:0;width:100%;font:inherit;color:inherit}
.card img{width:100%;aspect-ratio:4/3.1;object-fit:cover}
.card-body{display:block;padding:12px 14px 14px}
.card-title{display:block}
.card-note{display:block}
.card-pose{display:inline-block;background:var(--lav);color:var(--accent);font-weight:700;font-size:11.5px;border-radius:999px;padding:3px 10px;letter-spacing:.05em;margin-bottom:6px}
.card-pose b{font-family:"Shippori Mincho B1",serif;margin-right:5px}
.card-title{font-weight:700;font-size:14.5px;color:#5d4a38;line-height:1.5}
.card-note{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:2px}
.card.hide{display:none}
.modal-back{position:fixed;inset:0;background:rgba(93,74,56,.45);z-index:80;display:none}
.modal-back.open{display:block}
.modal{position:fixed;left:0;right:0;bottom:0;top:5vh;z-index:81;background:#fff;border-radius:34px 34px 0 0;box-shadow:0 -18px 50px rgba(93,74,56,.3);display:none;overflow-y:auto;padding:22px 22px 40px;overscroll-behavior:contain}
.modal.open{display:block}
@media (min-width:760px){.modal{left:50%;right:auto;transform:translateX(-50%);width:600px;top:7vh;border-radius:34px}}
.modal-x{position:sticky;top:0;float:right;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:18px;color:var(--brand-deep);cursor:pointer;z-index:2}
.modal img{width:100%;border-radius:22px;aspect-ratio:4/3.1;object-fit:cover}
.modal h3{font-family:"Shippori Mincho B1",serif;font-size:22px;color:#57452f;margin-top:16px}
.modal .m-note{font-size:14px;color:var(--ink-soft);margin-top:6px}
.modal .m-plan{background:var(--ivory);border-radius:14px;padding:12px 15px;font-size:13.5px;margin-top:14px;color:var(--ink-soft)}
.btn{display:flex;align-items:center;justify-content:center;border-radius:999px;padding:15px 30px;font-weight:700;font-size:15px;border:none;cursor:pointer;min-height:52px;width:100%;margin-top:18px;background:var(--brand-deep);color:#fff;box-shadow:0 12px 26px rgba(125,95,67,.3)}
.toast{position:fixed;left:16px;right:16px;bottom:16px;z-index:90;background:#57452f;color:#fff;border-radius:18px;padding:15px 18px;font-size:13.5px;box-shadow:0 16px 40px rgba(93,74,56,.4);display:none;line-height:1.65}
.toast.open{display:block}
footer{padding:34px 0 40px;text-align:center}
footer p{font-size:12px;color:#a08b74}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
</style>
</head>

<section class="hero">
<h1>ポーズ写真ガイド</h1>
<p>「どんな写真が撮れるの？」に、写真そのもので答える案内ページの提案です。サイト本体のギャラリーは7枚だけですが、調査で集めた作品は47点。ポーズごとに写真で見せて、気に入ったポーズはそのまま予約フォームの希望ポーズに引き継げる形を想定しています。</p>
</section>

   document.querySelectorAll('.f-btn').forEach(function(x){x.classList.toggle('cur',x===b)});
   var f=b.getAttribute('data-filter'), n=0;
   cards.forEach(function(c){ var show=(f==='all'||c.getAttribute('data-cat')===f); c.classList.toggle('hide',!show); if(show)n++ });
   countEl.textContent=n+' 枚の写真';
 });
});
var modal=document.getElementById('modal'), back=document.getElementById('modalBack'), body=document.getElementById('modalBody'), lastFocus=null;
function openModal(card){
 lastFocus=card;
 var img=card.querySelector('img'), pose=card.getAttribute('data-pose'), plan=card.getAttribute('data-plan');
 var title=card.querySelector('.card-title').textContent, note=card.querySelector('.card-note').textContent;
 body.innerHTML='';
 var im=document.createElement('img'); im.src=img.src; im.alt=img.alt; body.appendChild(im);
 var h=document.createElement('h3'); h.className='serif'; h.textContent=pose; body.appendChild(h);
 var p=document.createElement('p'); p.className='m-note'; p.textContent=title+'。'+note+'。'; body.appendChild(p);
 var mp=document.createElement('div'); mp.className='m-plan'; mp.textContent='選べるプラン：'+plan; body.appendChild(mp);
 var btn=document.createElement('button'); btn.className='btn'; btn.type='button'; btn.textContent='このポーズを希望して予約へ進む';
 btn.addEventListener('click',function(){ closeModal(); showToast('（モック）本番では、予約フォームの希望ポーズに「'+pose+'」が選ばれた状態で開きます。'); });
 body.appendChild(btn);
 modal.classList.add('open'); back.classList.add('open'); document.body.style.overflow='hidden'; modal.scrollTop=0;
 document.getElementById('modalX').focus();
}
function closeModal(){ modal.classList.remove('open'); back.classList.remove('open'); document.body.style.overflow=''; if(lastFocus)lastFocus.focus(); }
cards.forEach(function(c){ c.addEventListener('click',function(){openModal(c)}) });
document.getElementById('modalX').addEventListener('click',closeModal);
back.addEventListener('click',closeModal);
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&modal.classList.contains('open'))closeModal() });
var toast=document.getElementById('toast'), toastTimer=null;
function showToast(msg){ toast.textContent=msg; toast.classList.add('open'); if(toastTimer)clearTimeout(toastTimer); toastTimer=setTimeout(function(){toast.classList.remove('open')},4200); }
})();
</script>
</body>
</html>
